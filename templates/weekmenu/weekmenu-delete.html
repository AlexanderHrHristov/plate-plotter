{% extends 'base.html' %}

{% block title %}Изтриване на седмично меню | PlatePlotter{% endblock %}

{% block content %}
<h1 class="mb-4">Изтриване на седмично меню</h1>

<div class="alert alert-danger">
    Сигурни ли сте, че искате да изтриете седмицата от <strong>{{ object.start_date }}</strong>?
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, изтрий</button>
    <a href="{% url 'weekmenu-detail' object.pk %}" class="btn btn-secondary">Отказ</a>
</form>
{% endblock %}
