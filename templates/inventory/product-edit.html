{% extends 'base.html' %}

{% block title %}Редакция на продукт | PlatePlotter{% endblock %}

{% block content %}
<h1 class="mb-4">Редакция на продукт</h1>

<div class="card">
    <div class="card-body">
        <p class="mb-4"><strong>Продукт:</strong> {{ product }}</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-warning">Запази</button>
            <a href="{% url 'product-detail' product.pk %}" class="btn btn-secondary">Отказ</a>
        </form>
    </div>
</div>
{% endblock %}
