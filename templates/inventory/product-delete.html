{% extends 'base.html' %}

{% block title %}Изтриване на продукт | PlatePlotter{% endblock %}

{% block content %}
<h1 class="mb-4">Изтриване на продукт</h1>

<div class="alert alert-danger">
    Сигурни ли сте, че искате да изтриете <strong>{{ product }}</strong>?
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, изтрий</button>
    <a href="{% url 'product-detail' product.pk %}" class="btn btn-secondary">Отказ</a>
</form>
{% endblock %}
