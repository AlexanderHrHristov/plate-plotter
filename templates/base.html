<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PlatePlotter{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">PlatePlotter</a>

                <div class="collapse navbar-collapse show">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'product-list' %}">Продукти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'inventory-list' %}">Наличности</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'dish-list' %}">Ястия</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'weekmenu-list' %}">Седмично меню</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-light border-top py-3 mt-5">
        <div class="container text-center">
            <small>PlatePlotter © 2026</small>
        </div>
    </footer>
</body>
</html>
