{% extends 'base.html' %}

{% block title %}Добави продукт | PlatePlotter{% endblock %}

{% block content %}
<h1 class="mb-4">Добави продукт</h1>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">Запази</button>
            <a href="{% url 'product-list' %}" class="btn btn-secondary">Отказ</a>
        </form>
    </div>
</div>
{% endblock %}
