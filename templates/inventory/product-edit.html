{% extends 'base.html' %}

{% block title %}Редакция на продукт | PlatePlotter{% endblock %}

{% block content %}
<h1 class="mb-4">Редакция на продукт</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">Запази промените</button>
    <a href="{% url 'product-detail' product.pk %}" class="btn btn-secondary">Отказ</a>
</form>
{% endblock %}
